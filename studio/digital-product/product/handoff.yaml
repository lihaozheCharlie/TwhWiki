decisions:
  - "顶层产品结构按用户任务组织，Wiki 类型降为二级结构。"
  - "核心使用闭环为看见此刻、连接模式与证据、完整阅读或追问、回到生活。"
  - "保留兼容路由、资料库、编辑器、搜索、图谱和 Codex 工作台。"
  - "不引入成长评分、打卡和无来源的 AI 判断。"
  - "共创工作台按理解、沉淀、维护组织；默认只读理解，写入使用一次明确授权。"
  - "Agent 最终结果和下一步是一等内容，技术日志折叠到诊断层。"
  - "主要 Wiki 场景提供页面内上下文共创：提交前展示类目、当前内容、稳定页面路径与逐轮权限。"
  - "人生地图采用主线与并行人生线共存的可探索航图，不用单一时间轴伪造顺序。"
  - "人物、回信和结构化理解路径使用主从完整阅读；右侧直接加载完整内容，独立页面只是可选出口。"
  - "二级路径使用明确父级返回；具体页面继续保留来源语境返回，选中条目写入 URL 以支持浏览器前进后退。"
  - "首页当前问题使用新近证据、关注类型与连接广度排序，同时展示理由和其他候选。"
  - "事实证据、Wiki 判断与下一次观察使用独立语义，不把推断伪装成事实。"
  - "回信同时提供按写信时间与按生命主题的阅读线；材料区间不再冒充写信日期。"
  - "人物、人生阶段与关系图转向局部、上下文相关的纵向探索。"
assumptions:
  - "以当前真实用户与 Vault 观察到的问题可以代表首个开源版本的核心需求。"
constraints:
  - "不得修改或丢失 Vault、原始知识库和既有 Skills。"
  - "本地优先，只监听 127.0.0.1。"
  - "原始来源只读，综合 Wiki 写入继续受现有授权保护。"
